# À copier dans .github/workflows/ci.yml par quelqu'un dont le jeton GitHub a le droit « workflow ».
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:agenda
      - run: npm run test:sql
