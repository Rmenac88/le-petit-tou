<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Image de présentation Play Store</title>
<style>
@font-face{font-family:Bricolage;src:url('../../../node_modules/@expo-google-fonts/bricolage-grotesque/800ExtraBold/BricolageGrotesque_800ExtraBold.ttf')}
@font-face{font-family:Jakarta;src:url('../../../node_modules/@expo-google-fonts/plus-jakarta-sans/600SemiBold/PlusJakartaSans_600SemiBold.ttf')}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
.g{width:1024px;height:500px;position:relative;background:radial-gradient(circle at 78% 30%,#4a2f72 0,#2b1d46 55%,#1f1433 100%);color:#fff;font-family:Jakarta,system-ui,sans-serif}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7}
.logo{position:absolute;left:70px;top:150px;width:200px;height:auto;filter:drop-shadow(0 10px 30px rgba(0,0,0,.35))}
.txt{position:absolute;left:310px;top:120px;right:60px}
h1{font-family:Bricolage,system-ui,sans-serif;font-size:74px;line-height:.98;margin:0;letter-spacing:-1px}
h1 span{color:#ff8fa3}
p{font-size:25px;margin:22px 0 0;color:#e9def7}
.chips{display:flex;gap:12px;margin-top:26px}
.chip{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 18px;font-size:19px}
</style></head>
<body><div class="g">
<i class="star" style="left:120px;top:60px"></i><i class="star" style="left:520px;top:40px"></i><i class="star" style="left:880px;top:90px"></i>
<i class="star" style="left:960px;top:400px"></i><i class="star" style="left:300px;top:440px;opacity:.4"></i><i class="star" style="left:700px;top:460px;opacity:.5"></i>
<img class="logo" src="../../../assets/images/logo-transparent.png" alt="">
<div class="txt">
  <h1>Pour voir la ville<br><span>en rose.</span></h1>
  <p>789 bonnes adresses de Toulouse, testées par des étudiants.</p>
  <div class="chips"><span class="chip">Carte</span><span class="chip">Listes</span><span class="chip">Offres membres</span><span class="chip">Agenda</span></div>
</div>
</div></body></html>
